<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64BAFF"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="shieldRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CFE3FF"/>
    </linearGradient>
    <linearGradient id="shieldCoreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E4DB7"/>
      <stop offset="100%" stop-color="#0F2A6B"/>
    </linearGradient>
    <linearGradient id="ridgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#8FD3FF"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38D98D"/>
      <stop offset="100%" stop-color="#22A867"/>
    </linearGradient>
  </defs>

  <!-- Sombra base y squircle principal estilo elementary OS -->
  <rect x="12" y="14" width="104" height="104" rx="24" fill="#091D42" opacity="0.24"/>
  <rect x="12" y="10" width="104" height="104" rx="24" fill="url(#bgGrad)"/>
  <rect x="13" y="11" width="102" height="102" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity="0.34" stroke-width="2"/>

  <!-- Sombra del escudo -->
  <path d="M 64 23 L 99 35.5 C 99 67 86 90.5 64 104 C 42 90.5 29 67 29 35.5 Z" fill="#07193D" opacity="0.26" transform="translate(0, 2.5)"/>

  <!-- Borde exterior del escudo de seguridad -->
  <path d="M 64 22 L 99 34.5 C 99 66 86 89.5 64 103 C 42 89.5 29 66 29 34.5 Z" fill="url(#shieldRimGrad)"/>

  <!-- Interior azul profundo del escudo -->
  <path d="M 64 26.5 L 94.5 37.5 C 94.5 65 83 85.8 64 98 C 45 85.8 33.5 65 33.5 37.5 Z" fill="url(#shieldCoreGrad)"/>

  <!-- Brillo sutil superior dentro del escudo -->
  <path d="M 64 27.5 L 93.5 38 C 93.5 47 92 55 89 62 C 77 56 51 56 39 62 C 36 55 34.5 47 34.5 38 Z" fill="#FFFFFF" opacity="0.08"/>

  <!-- Huella dactilar centrada dentro del escudo -->
  <g fill="none" stroke="url(#ridgeGrad)" stroke-width="3.2" stroke-linecap="round">
    <path d="M 48.5 45.5 A 19 19 0 0 1 79.5 45.5"/>
    <path d="M 43.5 58 C 43.5 45.5 52.5 38 64 38 C 75.5 38 84.5 45.5 84.5 58 C 84.5 64.5 82.5 70.5 79 75.5"/>
    <path d="M 49 68 C 48.5 63.5 49 57 49 54.5 C 49 46.5 55.5 43 64 43 C 72.5 43 79 47.5 79 56 C 79 63.5 76.5 71 71.5 78"/>
    <path d="M 54.5 76 C 53.5 69.5 54.5 61 54.5 56.5 C 54.5 50.5 58.8 48 64 48 C 69.2 48 73.5 51 73.5 57.5 C 73.5 65 70.5 73 65 81"/>
    <path d="M 59.5 81.5 C 59 74 59.5 64.5 59.5 58.5 C 59.5 55 61.5 53.5 64 53.5 C 66.5 53.5 68.5 55.5 68.5 59.5 C 68.5 66.5 66 74 61 82.5"/>
    <path d="M 64 59.5 C 64 66.5 62 73 57.5 79.5"/>
  </g>

  <!-- Sello de verificación Mint -->
  <circle cx="93" cy="91" r="14" fill="#091D42" opacity="0.22" transform="translate(0, 1.5)"/>
  <circle cx="93" cy="91" r="14" fill="url(#badgeGrad)" stroke="#FFFFFF" stroke-width="2.6"/>
  <path d="M 86.8 91 L 91.2 95.4 L 99.8 86.6" fill="none" stroke="#FFFFFF" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
